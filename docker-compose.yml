# ═══════════════════════════════════════════════════════════
# Loger Togo — Docker Compose Production FINAL (Hetzner VPS)
#
# Corrections :
#  1. Service "fixer" qui corrige les permissions des volumes
#     AVANT le démarrage de web (résout le PermissionError)
#  2. healthcheck PostgreSQL pour éviter les crash au boot
#  3. Nginx optimisé avec compression gzip
# ═══════════════════════════════════════════════════════════
services:

  # ── Base de données PostgreSQL ─────────────────────────
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=logertogo
      - POSTGRES_USER=logeruser
      - POSTGRES_PASSWORD=logerpassword
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logeruser -d logertogo"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Correcteur de permissions (s'exécute une seule fois) ─
  # Résout le PermissionError sur les volumes Docker montés
  fixer:
    image: busybox
    command: >
      sh -c "
        echo 'Correction des permissions des volumes...' &&
        chown -R 999:999 /app/staticfiles /app/media &&
        chmod -R 755 /app/staticfiles /app/media &&
        echo 'Permissions corrigées.'
      "
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media

  # ── Application Django (Gunicorn) ──────────────────────
  web:
    build: .
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    environment:
      - DATABASE_URL=postgres://logeruser:logerpassword@db:5432/logertogo
      - DEBUG=False
      - DJANGO_SETTINGS_MODULE=logertogo.settings
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      fixer:
        condition: service_completed_successfully
    expose:
      - "8000"
    restart: always

  # ── Nginx (Reverse Proxy) ──────────────────────────────
  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    ports:
      - "80:80"
    depends_on:
      - web
    restart: always

volumes:
  postgres_data:
  static_volume:
  media_volume:
