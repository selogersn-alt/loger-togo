# =============================================================================
# Nginx VPS — Reverse Proxy Global (Docker app-nginx-1)
# =============================================================================

# Map to detect SSL proxying (e.g. from Cloudflare Flexible SSL)
map $http_x_forwarded_proto $ssl_redirect {
    default "yes";
    "https" "";
}

# ── BLOC PAR DÉFAUT (LOGERTOGO) ──────────────────────────────────────────────
server {
    listen 80 default_server;
    server_name _;
    return 301 http://logertogo.com$request_uri;
}

# ── LOGERTOGO.COM ──────────────────────────────────────────────────────────
server {
    listen 80;
    server_name logertogo.com www.logertogo.com agence.logertogo.com hotels.logertogo.com;
    
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    location / {
        if ($ssl_redirect = "yes") {
            return 301 https://$host$request_uri;
        }
        
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /static/ {
        alias /app/staticfiles/;
    }

    location /media/ {
        alias /app/media/;
    }
}

server {
    listen 443 ssl;
    server_name logertogo.com www.logertogo.com agence.logertogo.com hotels.logertogo.com;

    ssl_certificate     /etc/letsencrypt/live/logertogo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/logertogo.com/privkey.pem;

    client_max_body_size 500M;
    client_body_buffer_size 256k;
    client_body_timeout 300s;

    # Parametres SSL securises
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /app/staticfiles/;
    }

    location /media/ {
        alias /app/media/;
    }
}

