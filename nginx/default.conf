# ── AGENCE LOGER SENEGAL ─────────────────────────────────────────────────────
server {
    listen 80;
    server_name agence.logersenegal.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        if ($ssl_redirect = "yes") {
            return 301 https://$host$request_uri;
        }
        
        proxy_pass http://157.180.127.70:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
}

server {
    listen 443 ssl;
    server_name agence.logersenegal.com;
    client_max_body_size 100M;

    ssl_certificate     /etc/letsencrypt/live/agence.logersenegal.com/fullchain.pem; 
    ssl_certificate_key /etc/letsencrypt/live/agence.logersenegal.com/privkey.pem;   

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;      
    add_header X-XSS-Protection "1; mode=block" always;      
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://157.180.127.70:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

