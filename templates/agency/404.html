<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Introuvable (404) | Loger Togo Agence</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #0b4629;
            --primary-light: #10b981;
            --accent: #ffd700;
            --bg-dark: #0a0f0d;
            --panel-bg: rgba(16, 26, 21, 0.65);
            --border-glass: rgba(255, 255, 255, 0.08);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', 'Inter', sans-serif;
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(at 0% 0%, rgba(16, 185, 129, 0.08) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(11, 70, 41, 0.15) 0px, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(2deg); }
        }

        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 8px 32px 0 rgba(16, 185, 129, 0.15); }
            50% { box-shadow: 0 8px 40px 10px rgba(16, 185, 129, 0.3); }
        }

        .error-container {
            max-width: 600px;
            width: 100%;
            background: var(--panel-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--border-glass);
            border-radius: 24px;
            padding: 3.5rem 2.5rem;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            animation: pulse-glow 6s infinite alternate;
        }

        .error-badge {
            font-size: 5.5rem;
            font-weight: 800;
            line-height: 1;
            background: linear-gradient(135deg, #ffffff 30%, var(--primary-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1.5rem;
            letter-spacing: -2px;
        }

        .illustration {
            font-size: 4.5rem;
            margin-bottom: 1.5rem;
            display: inline-block;
            animation: float 4s ease-in-out infinite;
        }

        h2 {
            font-size: 2rem;
            margin-bottom: 1rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: #ffffff;
        }

        p {
            color: var(--text-muted);
            font-size: 1.05rem;
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        .btn-home {
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            background: linear-gradient(135deg, var(--primary-light), #059669);
            color: #ffffff;
            text-decoration: none;
            padding: 1rem 2rem;
            border-radius: 14px;
            font-weight: 600;
            font-size: 1.05rem;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 20px rgba(16, 185, 129, 0.2);
        }

        .btn-home:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 24px rgba(16, 185, 129, 0.35);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .btn-home i {
            transition: transform 0.2s ease;
        }

        .btn-home:hover i {
            transform: translateX(-4px);
        }
    </style>
</head>
<body>

    <div class="error-container">
        <div class="illustration">🔑</div>
        <div class="error-badge">404</div>
        <h2>Ressource Introuvable</h2>
        <p>
            Désolé, la page ou le bien immobilier que vous recherchez n'existe pas ou a été déplacé.<br>
            Vérifiez l'adresse saisie ou retournez à l'accueil de votre espace agence.
        </p>
        <a href="/promo/" class="btn-home">
            <i class="fa-solid fa-arrow-left"></i>
            Retourner à l'Espace Agence
        </a>
    </div>

</body>
</html>
