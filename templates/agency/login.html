<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Loger Togo Agence CRM</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #0b4629;
            --primary-glow: rgba(11, 70, 41, 0.45);
            --primary-light: #10b981;
            --accent: #ffd700;
            --bg-dark: #070a08;
            --panel-bg: rgba(16, 26, 21, 0.65);
            --border-glass: rgba(255, 255, 255, 0.08);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Immersive animated background gradient orbs */
        .bg-glow-container {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            overflow: hidden;
            z-index: 1;
            pointer-events: none;
        }

        .bg-glow-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(140px);
            opacity: 0.15;
            animation: floatGlow 20s infinite alternate ease-in-out;
        }

        .orb-1 {
            width: 500px;
            height: 500px;
            background: var(--primary-light);
            top: -100px;
            left: -100px;
        }

        .orb-2 {
            width: 600px;
            height: 600px;
            background: var(--primary);
            bottom: -150px;
            right: -100px;
            animation-delay: -5s;
        }

        .orb-3 {
            width: 300px;
            height: 300px;
            background: var(--accent);
            top: 40%;
            left: 60%;
            opacity: 0.06;
            animation-delay: -10s;
        }

        @keyframes floatGlow {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(80px, 50px) scale(1.1); }
        }

        /* Glassmorphic Auth Card */
        .auth-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 480px;
            padding: 1.5rem;
        }

        .auth-card {
            background: var(--panel-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--border-glass);
            border-radius: 28px;
            padding: 3rem 2.5rem;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            gap: 2rem;
            transition: all 0.3s ease;
        }

        /* Logo and Header Styling */
        .brand-header {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.75rem;
        }

        .brand-logo {
            width: 64px;
            height: 64px;
            border-radius: 18px;
            background: linear-gradient(135deg, var(--primary-light), var(--primary));
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 25px rgba(16, 185, 129, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            animation: pulseLogo 3s infinite ease-in-out;
        }

        @keyframes pulseLogo {
            0%, 100% { transform: scale(1); box-shadow: 0 8px 25px rgba(16, 185, 129, 0.3); }
            50% { transform: scale(1.04); box-shadow: 0 12px 30px rgba(16, 185, 129, 0.5); }
        }

        .brand-header h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.85rem;
            font-weight: 800;
            letter-spacing: -0.01em;
            background: linear-gradient(135deg, #ffffff, var(--primary-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand-header p {
            font-size: 0.95rem;
            color: var(--text-muted);
        }

        /* Premium Form Controls */
        form {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            position: relative;
        }

        .form-group label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--primary-light);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            position: absolute;
            left: 1.25rem;
            color: var(--text-muted);
            font-size: 1.1rem;
            pointer-events: none;
            transition: color 0.3s ease;
        }

        .form-control {
            width: 100%;
            padding: 1.05rem 1rem 1.05rem 3.25rem;
            background: rgba(10, 18, 14, 0.6);
            border: 1px solid var(--border-glass);
            border-radius: 14px;
            color: var(--text-main);
            font-size: 0.95rem;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .form-control::placeholder {
            color: rgba(243, 244, 246, 0.25);
        }

        .form-control:focus {
            border-color: var(--primary-light);
            background: rgba(10, 18, 14, 0.85);
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.2), inset 0 0 8px rgba(16, 185, 129, 0.05);
        }

        .form-control:focus + i {
            color: var(--primary-light);
        }

        /* Custom Checkbox */
        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            color: var(--text-muted);
            user-select: none;
        }

        .remember-me input {
            display: none;
        }

        .custom-checkbox {
            width: 18px;
            height: 18px;
            border-radius: 6px;
            border: 1px solid var(--border-glass);
            background: rgba(10, 18, 14, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .remember-me input:checked + .custom-checkbox {
            background: var(--primary-light);
            border-color: var(--primary-light);
        }

        .remember-me input:checked + .custom-checkbox i {
            opacity: 1;
            transform: scale(1);
        }

        .custom-checkbox i {
            color: #ffffff;
            font-size: 0.65rem;
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .forgot-password {
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .forgot-password:hover {
            color: var(--primary-light);
        }

        /* Buttons and CTAs */
        .btn {
            width: 100%;
            padding: 1.1rem;
            border-radius: 14px;
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            font-size: 1.05rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-light), var(--primary));
            color: #ffffff;
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.35);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.5);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        /* Toggle between views link */
        .toggle-link {
            text-align: center;
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-top: 0.5rem;
        }

        .toggle-link a {
            color: var(--primary-light);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s ease;
        }

        .toggle-link a:hover {
            color: var(--accent);
            text-decoration: underline;
        }

        /* Alerts Styling */
        .alert-container {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            width: 100%;
        }

        .alert {
            display: flex;
            align-items: center;
            gap: 0.85rem;
            padding: 0.9rem 1.25rem;
            border-radius: 12px;
            background: rgba(239, 68, 68, 0.08);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #f87171;
            font-size: 0.9rem;
            line-height: 1.4;
        }

        .alert-success {
            background: rgba(16, 185, 129, 0.08);
            border: 1px solid rgba(16, 185, 129, 0.2);
            color: #34d399;
        }

        .back-home {
            text-align: center;
            margin-top: 1rem;
        }

        .back-home a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.2s ease;
        }

        .back-home a:hover {
            color: var(--text-main);
            transform: translateX(-3px);
        }
    </style>
</head>
<body>

    <!-- Blurry Animated Background Orbs -->
    <div class="bg-glow-container">
        <div class="bg-glow-orb orb-1"></div>
        <div class="bg-glow-orb orb-2"></div>
        <div class="bg-glow-orb orb-3"></div>
    </div>

    <!-- Auth Container -->
    <div class="auth-container">
        <div class="auth-card">
            
            <!-- Header Logo -->
            <div class="brand-header">
                <div class="brand-logo">
                    <i class="fa-solid fa-hotel" style="color: #ffffff; font-size: 2rem;"></i>
                </div>
                <h1>Espace Agence</h1>
                <p>CRM Professionnel Loger Togo &bull; Gestion Immobilière</p>
            </div>

            <!-- Django Alert Messages -->
            {% if messages %}
            <div class="alert-container">
                {% for message in messages %}
                <div class="alert {% if message.tags == 'success' %}alert-success{% endif %}">
                    <i class="fa-solid {% if message.tags == 'success' %}fa-circle-check{% else %}fa-triangle-exclamation{% endif %}"></i>
                    <span>{{ message }}</span>
                </div>
                {% endfor %}
            </div>
            {% endif %}

            <!-- Login Form -->
            <form method="POST" action="{% url 'agency_login' %}{% if next %}?next={{ next }}{% endif %}">
                {% csrf_token %}
                
                <div class="form-group">
                    <label for="username">Identifiant (Tél ou E-mail)</label>
                    <div class="input-wrapper">
                        <input type="text" id="username" name="username" class="form-control" placeholder="Ex: +228 90 00 00 00 ou nom@email.com" required autocomplete="username">
                        <i class="fa-solid fa-user-tie"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Mot de passe</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" name="password" class="form-control" placeholder="Votre mot de passe secret" required autocomplete="current-password">
                        <i class="fa-solid fa-lock"></i>
                    </div>
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" name="remember">
                        <span class="custom-checkbox">
                            <i class="fa-solid fa-check"></i>
                        </span>
                        <span>Se souvenir de moi</span>
                    </label>
                    <a href="https://logertogo.com/recuperation-mot-de-passe/" class="forgot-password" target="_blank">Mot de passe oublié ?</a>
                </div>

                <button type="submit" class="btn btn-primary">
                    <span>Se connecter</span>
                    <i class="fa-solid fa-arrow-right-to-bracket"></i>
                </button>
            </form>

            <!-- Toggle links -->
            <div class="toggle-link">
                Nouveau partenaire ? <a href="{% url 'agency_register' %}">Créer un compte Agence</a>
            </div>

            <div class="back-home">
                <a href="https://logertogo.com/">
                    <i class="fa-solid fa-arrow-left"></i>
                    <span>Retour au site principal</span>
                </a>
            </div>

        </div>
    </div>

</body>
</html>
