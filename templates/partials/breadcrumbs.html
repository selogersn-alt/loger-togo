{% load i18n %}
<nav aria-label="breadcrumb" class="mb-4">
    <ol class="breadcrumb bg-transparent p-0 mb-0">
        <li class="breadcrumb-item">
            <a href="{% url 'home' %}" class="text-muted text-decoration-none small fw-bold">
                <i class="fa-solid fa-house me-1"></i> {% trans "Accueil" %}
            </a>
        </li>
        {% for crumb in breadcrumbs %}
            {% if forloop.last %}
                <li class="breadcrumb-item active text-main small fw-bold" aria-current="page">{{ crumb.name }}</li>
            {% else %}
                <li class="breadcrumb-item">
                    <a href="{{ crumb.url }}" class="text-muted text-decoration-none small fw-bold">{{ crumb.name }}</a>
                </li>
            {% endif %}
        {% endfor %}
    </ol>
</nav>
